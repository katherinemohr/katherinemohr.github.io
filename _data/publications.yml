arom:
  title: "The Kernel's Write: Application Read-Only Memory"
  abstract: "<p>
    Alongside power, DRAM has become a major limiting factor in datacenter growth.
    As DRAM's cost-per-bit has plateaued over the past decade, a class of emerging memory technologies, called Long-term RAM (LtRAM), offers a path to denser and cheaper main memory.
    <br/><br/>
    However, LtRAM has three main drawbacks: asymmetric read/write latencies, limited endurance, and coarse write granularity.
    In an attempt to isolate software from these drawbacks, LtRAM technologies such as Intel Optane copy an approach from flash devices and introduce a translation layer that manages wear-leveling, address remapping, and read/write caching. Prior experimental studies have found these operations add significantly to LtRAM latency.
    <br/><br/>
    Rather than making LtRAM look like DRAM, we propose redesigning the hardware/software interface to offload more responsibility to the operating system. This design hinges on one central property, Application Read-Only Memory (AROM): LtRAM pages are read-only to applications and written only by the OS during page migrations. AROM is enforced by leveraging copy-on-write (CoW): application writes to LtRAM trigger a fault that migrates the page back to DRAM before the store is applied. This invariant allows us to shift LtRAM management from the on-DIMM controller to the operating system, drastically simplifying the DIMM's hardware. With this approach, we aim to match the performance of pure DRAM on read-mostly workloads while delivering LtRAM's density and cost advantages.
    </p>"
  venue: "Workshop on Disruptive Memory Systems (DIMES)"
  year: 2026
  authors:
    - hsshim
    - kmohr
    - pal
  pdf: https://arxiv.org/pdf/2606.26138
  poster: assets/publications/AROM_LtRAM.pdf

arca:
  title: "Continuation-Centric Computing with Arca"
  abstract: "<p>
    This paper presents continuation-centric computing, an operating system design paradigm for “serverless”-style workloads: short-lived tasks that spend a substantial fraction of time waiting on dependencies and other services. Under this paradigm, a running function can capture its current continuation—a lightweight snapshot of its state—as a distinct function that can be paused, migrated, or copied as needed.
    <br/><br/>
    This paper evaluates the continuation-centric computing model using Arca, an operating system providing continuation capture as a core service. Arca supports a process abstraction that is broadly similar to Unix processes in guarantees and isolation, but additionally provides efficient capture and resumption of serializable, portable continuations.
    </p>"
  venue: "Operating Systems Design and Implementation (OSDI)"
  year: 2026
  month: "July"
  # publisher: "USENIX Association"
  # address: "USA"
  # booktitle: "Proceedings of the 19th USENIX Conference on Operating Systems Design and Implementation"
  # location: "Seattle, WA, USA"
  # series: "OSDI '26"
