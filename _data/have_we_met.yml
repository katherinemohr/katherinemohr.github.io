# Add an entry for each place/event where someone may have met me.
# sort_date is used only to order entries (most recent first) - use YYYY-MM-DD
# (the start date is fine for ranges). dates is the human-readable text shown on the page.
# site is optional - a URL that makes the event name clickable.
# type is optional - set to "recurring" for ongoing things like reading groups;
# omit it (or set it to "event") for one-off events.
# - event: "Event Name"
#   dates: "Dates"
#   sort_date: "YYYY-MM-DD"
#   location: "Location"
#   notes: "Notes"
#   site: "https://example.com"
#   type: "event"

